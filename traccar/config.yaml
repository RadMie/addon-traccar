---
name: Traccar 6 (RadMie)
version: "6.14.5.1"
slug: traccar
description: Modern GPS Tracking Platform - Traccar 6.14.5
url: https://github.com/RadMie/addon-traccar
webui: "[PROTO:ssl]://[HOST]:[PORT:80]"
panel_icon: mdi:car-connected
startup: services
arch:
  - aarch64
  - amd64
init: false
host_network: true
ports:
  80/tcp: 8082
ports_description:
  80/tcp: Web interface
map:
  - addon_config:rw
  - homeassistant_config:ro
  - ssl
services:
  - mysql:want
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  ssl: bool
  certfile: str
  keyfile: str
